const CHAINS={memory:{label:"記憶體",icon:"💾",color:"#2563eb",layers:[{name:"DRAM / HBM",companies:[{ticker:"SK Hynix",note:"HBM 市佔 57-62%，營業利潤率 72%，可用產能歸零。Big Tech 提出投資專線搶產能，態度謹慎。龍仁 Cluster Phase 1 已有客戶針對性投資提案。",flag:"🇰🇷"},{ticker:"Samsung DS",note:"產線轉 HBM/DDR5，停產 2D NAND（華城 Line 12 轉 1c DRAM）。MX vs DS 內部利益衝突浮上檯面，Memorypocalypse 下 DS 不願折價供應 MX。開發 Mobile HBM（VCS 銅柱高寬比 15-20:1）。",flag:"🇰🇷"},{ticker:"Micron",note:"PIM/CIM 是最被低估的上漲空間。Samsung HBM-PIM 展示 2x 性能 + 70% 能耗降低。如果 PIM/CIM 成為標準，估值邏輯根本改變——從週期性元件變成核心運算基礎設施。",flag:"🇺🇸"},{ticker:"南亞科 2408",note:"DDR4 結構性缺貨到年底（佔超過一半營收）。打入 Vera Rubin HBM 供應鏈。DDR5 16Gb 客戶驗證中，預計 2026H2 貢獻。Q1 毛利率 67% 歷史新高，Q2 預估再漲數十個百分比。",flag:"🇹🇼"}]},{name:"NAND",companies:[{ticker:"旺宏",note:"2D NAND 市佔持續擴大（與華邦電合佔 59%）。4 月營收年增 153.7% 創歷史新高。MLC eMMC 供應缺口預計至少 3 年無有效競爭。計畫將 NOR:NAND 比例拉向 1:1。",flag:"🇹🇼"},{ticker:"華邦電",note:"專注 SLC NAND + NOR Flash，不進入 MLC。SLC NAND 位元成長預估 80%+。新 24nm 製程 Q2 起提升。SLC NAND 毛利率預計超越 NOR Flash。",flag:"🇹🇼"}]},{name:"CXL / 記憶體介面",companies:[{ticker:"Astera Labs",note:"CXL 重定時器市佔 55%，毛利率 76.4%。CXL 3.x 讓整個機架記憶體可以被多個 GPU 共享調度，提高利用率。",flag:"🇺🇸"},{ticker:"Montage 瀾起",note:"CPU 採用率提升 + CXL 佈局。Jukan 偏好 Montage 勝過 Rambus。",flag:"🇨🇳"}]},{name:"中國記憶體",companies:[{ticker:"CXMT 長鑫",note:"已進入 Corsair DDR5 供應鏈（6000MT/s），量產最高 8000MT/s DDR5。代表消費級 DRAM 缺口已大到國際品牌願意採用中國晶片。",flag:"🇨🇳"}]}]},abf:{label:"ABF 基板 / 先進封裝",icon:"📦",color:"#7c3aed",layers:[{name:"ABF 膜材（上游材料）",companies:[{ticker:"Ajinomoto 味之素",note:"全球 ABF 膜材 95%+ 壟斷。Q3 2026 漲價 30%。AI 晶片封裝層數從 3+3 擴展到 11+11，2030 年後可能 13+13。第三廠 2028 動工、2032 量產。擴產週期 6 年。",flag:"🇯🇵"},{ticker:"Nittobo",note:"T-Glass 玻纖供應商。不打算漲價，日本企業太注重客戶關係。Jukan 因此不買 Nittobo 和 Ajinomoto。",flag:"🇯🇵"}]},{name:"ABF 基板製造",companies:[{ticker:"欣興 Unimicron",note:"規模最大、技術最全面。4 月營收 NT$139.3 億創歷史新高。ABF 擴產 40%，AI 營收佔比目標 60%。同時吃到 CoWoS 和 EMIB-T 兩種封裝架構。",flag:"🇹🇼"},{ticker:"景碩 Kinsus",note:"ASE 集團生態系。正在為 NVIDIA 開發「多種不同」載板，不只接單生產而是協同開發。多規格開發能力是差異化。",flag:"🇹🇼"},{ticker:"臻鼎 Zhen Ding",note:"全球最大 PCB 廠，往高階 ABF 擴展。已是中國 AI 晶片重要供應商 + 進行 Google TPU 載板認證。客戶最分散（NVIDIA + Google + 中國）。駿HaYao 升評至 OW。",flag:"🇹🇼"},{ticker:"南電",note:"EPS 預估上調，受益 ABF 供需缺口擴大。",flag:"🇹🇼"},{ticker:"Ibiden",note:"EMIB-T 基板第一供應商。投資 2,200 億日圓建產線，2027 稼動、2028 本格量產。窯工廠轉換為 EMIB-T 基板量產線。",flag:"🇯🇵"}]},{name:"封裝架構",companies:[{ticker:"TSMC CoWoS",note:"主流 AI 晶片封裝。矽中介層承擔路由責任。台積電也有自家矽電容技術。COUPE 平台佈局光學整合。",flag:"🇹🇼"},{ticker:"Intel EMIB-T",note:"替代路線，把路由責任從矽中介層轉到 ABF 基板。Google v8e TPU + SpaceX/xAI 已確定採用。對基板技術要求更高，帶動 Ibiden、SEMCO 需求。",flag:"🇺🇸"}]}]},optical:{label:"CPO / 矽光子 / 光通訊",icon:"📡",color:"#dc2626",layers:[{name:"材料",companies:[{ticker:"AXTI",note:"InP 基板材料壟斷。Serenity $14→$140。被稱為「國家級供應鏈漏洞」。InP 同時供應 CPO 雷射和光傳輸設備（Nokia 等），需求來自多條線。",flag:"🇺🇸"},{ticker:"IQE",note:"外延晶圓供應商（英國上市）。在 InP 基板上長磊晶層，等於幫麵粉加酵母。",flag:"🇬🇧"},{ticker:"NGK 5333",note:"TFLN（薄膜鈮酸鋰）晶圓壟斷者。8 吋突破是 OFC 2026 焦點。TFLN 是下一代光調變器最佳材料：1V 調變、100GHz 頻寬、極低光損。跟 AXTI 互補（一個發光，一個調變）。52 週漲超 3 倍。",flag:"🇯🇵"},{ticker:"HyperLight",note:"TFLN Chiplet 平台，與 UMC + Jabil 合作量產。CEO 說「TFLN 作為小眾技術的時代結束了」。",flag:"🇺🇸"}]},{name:"雷射光源（瓶頸最明顯）",companies:[{ticker:"SIVE",note:"CPO chokepoint。DFB 雷射架構獨特不可互換。主要 CPO 玩家（Ayar、Celestial、Lightmatter、Lightelligence、Poet）都通過 SIVE。量產放量 2027 年。目標透過 M&A 擴展至下游。⚠️ 仍處虧損，泡沫風險高。",flag:"🇸🇪"},{ticker:"Win Semi 穩懋",note:"雷射晶圓代工瓶頸。SIVE 設計、Win Semi 製造。產能分配決定誰能拿到多少雷射。",flag:"🇹🇼"},{ticker:"Lumentum",note:"傳統光學大廠，產能全押高毛利 EML。CW Laser 產能不足，在 CPO 生態系中部分份額被 SIVE 取代。",flag:"🇺🇸"}]},{name:"矽光子 / 光引擎",companies:[{ticker:"SOI Soitec",note:"主導 SOI 基板市場，矽光子晶圓代工。Serenity 持倉，$45→$170。",flag:"🇫🇷"},{ticker:"Ayar Labs",note:"NVIDIA 投資。光學 I/O chiplet。雷射供應商從 Lumentum/MACOM 換成只剩 SIVE。",flag:"🇺🇸"},{ticker:"Celestial AI → Marvell",note:"光子互連 fabric，可做 row-scale 相干記憶體和網內集合運算。2025/12 被 Marvell 以 $32.5 億收購。",flag:"🇺🇸"},{ticker:"FOCI 上詮 3363",note:"FAU（光纖陣列單元）與台積電合作 3 年，規格推到 1.6T/3.2T。⚠️ 未來有被台積電旗下采鈺（Visera, 6789）垂直整合風險，短期 2-3 年有大機會。",flag:"🇹🇼"},{ticker:"Lightmatter",note:"光子互連平台 Passage，用光連接不同 AI 加速器。",flag:"🇺🇸"}]},{name:"檢測 / 設備",companies:[{ticker:"MSScorp 6830",note:"CPO 良率檢測專利護城河，實質性壟斷。切入矽光子和 CPO 的檢測分析。良率是 CPO 最大瓶頸 ,icon:"🖥️",color:"#059669",layers:[{name:"GPU",companies:[{ticker:"NVIDIA",note:"全棧平台：GPU + CPU + Edge。業務敘事重寫為 Data Center + Edge Computing（Physical AI）。Vera CPU 獨立 $200 億市場，超越 x86。F1Q 營收 $806 億，F2Q 指引 $910 億。Rubin 延至 9 月。LPX 16,000 台出貨。中國營收降至 5%。法說點名 = 供應鏈 TAM 認證書。",flag:"🇺🇸"},{ticker:"AMD",note:"Helios 機架平台 2H26 全面量產。Microsoft 指定第二 AI 加速器平台，Meta、xAI 也是客戶。Anthropic 簽約 MI450。MI455 維持 3Q 出貨。MI550 用 2nm + 4 chiplet，單 GPU 性能可能優於 Rubin Ultra。已確保 2027 年 160-180k 片 CoWoS。",flag:"🇺🇸"}]},{name:"Custom ASIC",companies:[{ticker:"Marvell MRVL",note:"18 個活躍專案：AWS Trainium、Google TPU、Microsoft Maia 等。Custom XPU FY2026 營收 $15 億，FY2028 翻倍。同時綁 NVIDIA（NVLink Fusion）和 hyperscaler，兩邊贏都有位置。",flag:"🇺🇸"},{ticker:"Broadcom",note:"Google TPU 主要合作夥伴。Custom ASIC 業務快速成長。",flag:"🇺🇸"},{ticker:"聯發科 MTK",note:"SpaceX + xAI 資料中心 ASIC（Intel 14A + EMIB-T）。ASIC 營收預期：$22 億（2026）→ $180 億（2027）→ $480 億（2028）。目標價上調至 NT$5,520。",flag:"🇹🇼"}]},{name:"CPU",companies:[{ticker:"NVIDIA Vera",note:"獨立 $200 億市場，超越 x86。250 萬顆 × 8 個 SoCAMM 插槽，LPDDR5 需求接近手機全年用量。N3 產能從 Rubin 轉向 Vera，判斷 Agentic AI 的 CPU 需求更急。",flag:"🇺🇸"},{ticker:"Qualcomm",note:"LPU-like AI ASIC 2026 底出貨，約 100 萬顆 ASP $4,000。通用伺服器 CPU 2027H2。同時與中國 CSP 和兩家美國 CSP 合作。低功耗 Physical AI 場景有競爭力。",flag:"🇺🇸"},{ticker:"Intel",note:"14A 製程 + EMIB-T 封裝。爭取代工客戶（聯發科 TPU 等）。據報開發 18A CPU 與 MacBook Neo 競爭。需同時吸收 TSMC 代工客戶和擴充自有 CPU 產能。",flag:"🇺🇸"}]},{name:"測試設備",companies:[{ticker:"Advantest",note:"GPU 架構複雜化 → 測試步驟可能指數成長。Jukan watchlist。",flag:"🇯🇵"},{ticker:"Delton 德隆",note:"CPU 基板專業製造商。Jukan watchlist。",flag:"🇹🇼"}]}]},infra:{label:"AI 基礎設施 / Neocloud",icon:"☁️",color:"#0891b2",layers:[{name:"Neocloud",companies:[{ticker:"NBIS Nebius",note:"Serenity 偏好的 Neocloud。NVIDIA 實際投入資金。",flag:"🇳🇱"},{ticker:"IREN",note:"⚠️ Serenity 認為是「行銷公司」，靠行銷吸引散戶資金。從高點回跌 34%，持續稀釋。",flag:"🇺🇸"}]},{name:"AI-RAN / 邊緣計算",companies:[{ticker:"Nokia",note:"AI-RAN 三層：AI for RAN（優化營運）、AI and RAN（共享設施）、AI on RAN（邊緣平台）。T-Mobile 測試在 Grace Hopper 200 上同時跑 AI 和 RAN。AirScale 可升級。",flag:"🇫🇮"},{ticker:"Qualcomm",note:"低功耗 Physical AI 場景：AMR、無人機、工業視覺。在邊緣推理市場有競爭力。",flag:"🇺🇸"}]}]}};
const INSIGHTS=[{title:"瓶頸逐層剝洋蔥",desc:"GPU → 記憶體 → 基板 → 供電 → 光互連 → 設備，每層解決後下一層浮現"},{title:"Supply Chain Inheritance",desc:"AI capex 繼承 EV 供應鏈，供應商被燒怕了寧可漲價不擴產"},{title:"EMIB-T 重塑格局",desc:"Google TPU + SpaceX/xAI 採用，帶動矽電容、Ibiden 基板、SEMCO 暴漲"},{title:"記憶體缺到 2028",desc:"新產能最快 2027 底上線，長約鎖量悖論加速漲價，DRAM 營收年增 303%"},{title:"光互連從概念到工程",desc:"server-to-server → chip-to-chip，OSAT 表示「明確軌跡，只是時間問題」"},{title:"NVIDIA 定義 TAM",desc:"法說點名 = 供應鏈 TAM 認證書，被點名的公司股價立刻重新定價"}];
let activeChain="optical",selectedTicker=null;
const allCompanies=[];
Object.entries(CHAINS).forEach(([k,c])=>c.layers.forEach(l=>l.companies.forEach(co=>allCompanies.push({...co,chainKey:k,chain:c.label,layer:l.name,color:c.color}))));
function render(){
const tabs=document.getElementById("tabs");
tabs.innerHTML="";
Object.entries(CHAINS).forEach(([k,c])=>{const b=document.createElement("button");b.className="tab"+(activeChain===k?" active":"");b.textContent=c.icon+" "+c.label;b.style.background=activeChain===k?c.color:"#1f1f23";b.onclick=()=>{activeChain=k;selectedTicker=null;render()};tabs.appendChild(b)});
const chain=CHAINS[activeChain];
const root=document.documentElement;
root.style.setProperty("--chain-color",chain.color);
root.style.setProperty("--chain-color-dim",chain.color+"22");
const content=document.getElementById("chainContent");
let html=`<div class="chain-box"><div class="chain-header"><span class="icon">${chain.icon}</span><div><h2>${chain.label}</h2><p class="info">${chain.layers.length} 層 ｜ ${chain.layers.reduce((a,l)=>a+l.companies.length,0)} 家公司</p></div></div>`;
chain.layers.forEach((layer,li)=>{
html+=`<div class="layer"><div class="layer-name"><div class="layer-bar" style="background:${chain.color}"></div><span>${layer.name}</span></div><div class="companies">`;
layer.companies.forEach(co=>{
const sel=selectedTicker===co.ticker;
const cls="co-btn"+(sel?" selected":"")+(co.hl?" highlight":"");
const bg=sel?chain.color+"22":co.hl?"#eab30811":"#18181b";
const bc=sel?chain.color:co.hl?"#eab308":"#27272a";
const clr=sel?"#fafafa":co.hl?"#eab308":"#d4d4d8";
html+=`<button class="${cls}" style="background:${bg};border-color:${bc};color:${clr}" onclick="selectCompany('${co.ticker.replace(/'/g,"\\'")}')">${co.flag} ${co.ticker}</button>`;
});
html+=`</div></div>`;
});
html+=`</div>`;
content.innerHTML=html;
const detail=document.getElementById("detail");
if(selectedTicker){
const co=allCompanies.find(c=>c.ticker===selectedTicker);
if(co){document.getElementById("detailTitle").textContent=co.flag+" "+co.ticker;document.getElementById("detailPath").textContent=co.chain+" › "+co.layer;document.getElementById("detailNote").textContent=co.note;detail.className="detail show"}
}else{detail.className="detail"}
}
function selectCompany(ticker){selectedTicker=selectedTicker===ticker?null:ticker;const co=allCompanies.find(c=>c.ticker===ticker);if(co&&co.chainKey!==activeChain){activeChain=co.chainKey}render()}
function closeDetail(){selectedTicker=null;render()}
document.getElementById("search").addEventListener("input",function(e){
const q=e.target.value.toLowerCase();const box=document.getElementById("searchResults");
if(q.length<2){box.className="search-results";box.innerHTML="";return}
const results=allCompanies.filter(c=>c.ticker.toLowerCase().includes(q)||c.note.toLowerCase().includes(q));
if(!results.length){box.className="search-results";box.innerHTML="";return}
box.className="search-results show";
box.innerHTML=results.slice(0,10).map(c=>`<div class="sr-item" onclick="document.getElementById('search').value='';document.getElementById('searchResults').className='search-results';selectCompany('${c.ticker.replace(/'/g,"\\'")}')"><b>${c.flag} ${c.ticker}</b><span class="meta">${c.chain} › ${c.layer}</span></div>`).join("");
});
const ig=document.getElementById("insightsGrid");
ig.innerHTML=INSIGHTS.map(i=>`<div class="ins-card"><p class="t">${i.title}</p><p class="d">${i.desc}</p></div>`).join("");
render();
</script>
