name": "電源系統", "companies": [{"ticker": "台達電 2308", "note": "瑞銀認為 800VDC 最大受益者。已在中國出貨 SST。EV 800V 技術直接轉移 AI（Supply Chain Inheritance）。", "flag": "🇹🇼"}, {"ticker": "Vertiv $VRT", "note": "4.8MW 列級電源方案領先。SemiAnalysis 也看好。", "flag": "🇺🇸"}]}, {"name": "電力需求規模", "companies": [{"ticker": "AI 資料中心", "note": "傳統 10-15kW → Feynman 1.5MW（近百倍）。2025-2030 累計新增 233GW。800V 減銅 45%、轉換從 5 階段降到 2。⚠️ SemiAnalysis：原生 800V 可能推遲至 2028，400V 先行。", "flag": "🌐"}]}]}, "equipment": {"label": "半導體設備", "icon": "🔧", "color": "#6d28d9", "layers": [{"name": "前段設備", "companies": [{"ticker": "TEL 8035.JP", "note": "全球第三大。塗佈/蝕刻/成膜/清洗。全線滿產雙班制，推動漲價。SK Hynix 375 層 NAND 選 TEL 爐管型鉬沉積。WFE 2026 成長超 20%，DRAM +30%、NAND +40%。", "flag": "🇯🇵"}, {"ticker": "Lam Research", "note": "蝕刻和成膜設備龍頭。Samsung 選 Lam 做鉬沉積。", "flag": "🇺🇸"}, {"ticker": "AMAT", "note": "最大半導體設備商。SKC Absolics 玻璃基板用 AMAT 設備。", "flag": "🇺🇸"}]}, {"name": "後段設備", "companies": [{"ticker": "DISCO", "note": "切割研磨設備。開始吃緊。", "flag": "🇯🇵"}, {"ticker": "EVG", "note": "接合設備。開始吃緊。", "flag": "🇦🇹"}, {"ticker": "Advantest", "note": "GPU 測試步驟可能指數成長。Jukan watchlist。", "flag": "🇯🇵"}]}, {"name": "光子設備", "companies": [{"ticker": "AEHR", "note": "光子晶圓級 burn-in。hyperscaler 破紀錄訂單。3 個月漲 3 倍。", "flag": "🇺🇸"}]}]}, "infra": {"label": "基礎設施", "icon": "☁️", "color": "#0891b2", "layers": [{"name": "Neocloud", "companies": [{"ticker": "NBIS Nebius", "note": "Serenity 偏好。NVIDIA 投入資金。", "flag": "🇳🇱"}, {"ticker": "IREN", "note": "⚠️ 行銷公司、持續稀釋。qinbafrank：高負債、資產貶值、下行期破產。", "flag": "🇺🇸"}]}, {"name": "AI-RAN / 邊緣", "companies": [{"ticker": "Nokia", "note": "AI-RAN 三層。T-Mobile 測試 Grace Hopper。Jensen 直接點名。", "flag": "🇫🇮"}, {"ticker": "Qualcomm", "note": "低功耗 Physical AI。", "flag": "🇺🇸"}]}]}};
const FAQS=[{"cat": "NVIDIA", "q": "NVIDIA 這次財報跟以往不同的點？為什麼點名的廠商都會暴漲？", "a": "<strong>三個最大差異：</strong><div class=\"point\">1. 業務敘事重寫：Data Center + Edge Computing（Physical AI）。</div><div class=\"point\">2. Vera CPU 獨立成 $200 億市場，超越 x86。SoCAMM 需求接近手機全年 LPDDR5。</div><div class=\"point\">3. N3 產能從 Rubin 挪去 Vera CPU，判斷 CPU 需求比下一代 GPU 更急。</div><strong>為什麼暴漲：</strong>NVIDIA 是 AI capex 定價錨。法說點名 = TAM 認證書。加上 Supply Chain Inheritance：供應商寧願漲價不擴產，需求確認後價格和利潤率同時上走。"}, {"cat": "瓶頸", "q": "記憶體、ABF、MLCC、CPO 為什麼是供應鏈瓶頸？", "a": "<strong>記憶體：</strong>HBM 吃掉 DRAM 產能，兩邊同時缺。<strong>ABF：</strong>AI 晶片變大，層數倍增（3+3→11+11），膜材 95% 壟斷。<strong>MLCC：</strong>AI 伺服器用量數倍於傳統（800V 架構需上萬顆）。<strong>CPO：</strong>銅線 800G 以上撞物理極限，但每個環節都卡。<div class=\"point\"><strong>共同邏輯：</strong>需求指數級，擴產線性（2-3 年蓋廠），單點壟斷多，供應商不敢激進擴產。</div>"}, {"cat": "記憶體", "q": "TPU 或哪一種設計可以降低 HBM 需求？", "a": "<strong>PIM/CIM：</strong>最根本，計算放在記憶體裡做。3-5 年後。<strong>CXL 池化：</strong>提高利用率但不減總量。<strong>推理 ASIC（Groq LPU）：</strong>用 SRAM 取代，只適合推理。<strong>Google TPU：</strong>也用 HBM，靠 JAX/XLA 軟體最佳化。<strong>軟體：</strong>量化和 MoE 減緩成長但模型也在變大。<div class=\"point\">短期 1-2 年無法降低 HBM 需求。中期 PIM/CIM 有機會。長期三者成熟後記憶體角色根本改變。</div>"}, {"cat": "ABF", "q": "欣興、景碩、臻鼎的個別優勢？跟記憶體比較？", "a": "<strong>欣興：</strong>規模最大，NVIDIA+Intel 雙吃。<strong>景碩：</strong>跟 NVIDIA 合作最深，多規格開發。<strong>臻鼎：</strong>客戶最分散（Google TPU+中國 AI）。<div class=\"point\"><strong>跟記憶體比：</strong>DRAM $1,200 億 vs ABF $100-150 億，量級差 10 倍。但 ABF 瓶頸感更強：供應集中度更高、擴產更久、乘數效應更大、沒有現貨市場緩衝。</div>"}, {"cat": "CPO", "q": "CPO 為什麼重要？關鍵廠商和節點？", "a": "GPU 算力夠強但資料流動跟不上。銅線 800G 以上撞極限。<strong>六層：</strong><div class=\"point\">材料：AXTI（InP）、IQE（磊晶）、NGK（TFLN）</div><div class=\"point\">雷射：SIVE（chokepoint）、Win Semi（代工）</div><div class=\"point\">光引擎：SOI、GFS、Ayar、Celestial→Marvell、HyperLight、FOCI</div><div class=\"point\">檢測：MSScorp（良率）、AEHR（burn-in）</div><div class=\"point\">DSP：Marvell、Broadcom、AAOI</div><div class=\"point\">封裝：訊芯-KY、ASE</div>越上游規模越小、股價越容易暴漲暴跌。"}, {"cat": "MLCC", "q": "國巨能吃到高端 MLCC / 矽電容嗎？", "a": "<strong>矽電容：吃不到。</strong>只有 TSMC、Murata、SEMCO。<strong>高端 AI MLCC：很難直接切入。</strong>需要參與 PDN 仿真。<strong>間接受益：</strong>Tier 1 往高端走後，中端空出（Macronix effect）。國巨中端市佔擴大，ASP 跟漲。<div class=\"point\">Zephyr：MLCC 設備和原材料供應商可能是最大受益者。</div>"}, {"cat": "MLCC", "q": "村田製作所的業務和優勢？", "a": "MLCC 龍頭，月產 1,600 億顆。正從零件商轉型 AI 供電整合商。<strong>三條線：</strong><div class=\"point\">1. 高端 MLCC：800 層、漲 15-35%、2030 年需求 3.3 倍</div><div class=\"point\">2. 矽電容：跟 Ibiden 綁定供應 Intel EMIB</div><div class=\"point\">3. 電源模組：2026 量產，FY2027 前兩年 500 億日圓</div><strong>護城河：</strong>材料科學 + PDN 協同設計 + 全產品線整合。📌觀察名單。"}, {"cat": "公司", "q": "Marvell 的業務和前景？", "a": "AI 數據基礎設施平台型晶片公司。<strong>兩條線：</strong>光互連 DSP（收購 Celestial AI $32.5 億）+ Custom Silicon（18 專案，AWS/Google/Microsoft）。<strong>NVIDIA 投 $20 億 + NVLink Fusion。</strong>護城河：不管 NVIDIA 贏還是 Custom ASIC 贏都有位置。<strong>風險：</strong>估值不便宜、客戶集中、NVIDIA 可能限制 Custom XPU 發展。"}, {"cat": "公司", "q": "Nokia 業務和優勢？", "a": "用光纖把 AI 資料中心連起來的公司。Optical +20%，Infinera 收購補齊相干光。NVIDIA 投 $10 億。AI & Cloud 營收年增 49%。AI-RAN 第二曲線。Jensen 直接點名。分析師 2028 EBIT 較指引高 58%。<strong>風險：</strong>InP 供應鏈限制、已漲 73%。"}, {"cat": "公司", "q": "NGK 5333 是什麼？", "a": "日本陶瓷公司（1919 年）。掌握 TFLN 晶圓工業級量產（8 吋突破）。TFLN 是下一代光調變器最佳材料：1V 調變、100GHz。跟 AXTI 互補：AXTI 做雷射材料，NGK 做調變器材料。下游 HyperLight+UMC+Jabil 推向量產。Serenity 列在實質性壟斷名單。52 週漲超 3 倍。"}, {"cat": "瓶頸", "q": "整體產業敘事和 Insight？", "a": "<strong>瓶頸逐層剝洋蔥：</strong>GPU→記憶體→基板→供電→光互連→設備→原材料。<strong>Supply Chain Inheritance：</strong>AI 繼承 EV 供應鏈，供應商寧可漲價不擴產。<strong>EMIB-T 重塑格局：</strong>Google+SpaceX/xAI 採用，帶動矽電容和 Ibiden。<strong>記憶體缺到 2028：</strong>新產能 2027 底，長約鎖量悖論。<strong>光互連概念→工程：</strong>server-to-server→chip-to-chip。"}, {"cat": "概念", "q": "SoCAMM2 是什麼？", "a": "SoCAMM = System on Chip and Memory Module。把 LPDDR5X 直接焊在模組上插在 CPU 旁邊。Vera CPU 每顆 8 個 SoCAMM 插槽。<strong>SoCAMM2 第二代：</strong>NVIDIA 改策略從 192GB→96GB，出貨量拉高 6 倍（降規增量）。總需求反而增 10-20%。Meritz：DRAM 週期才到「大腿」。<div class=\"point\">代表記憶體跟 CPU 距離越來越近：DIMM（遠）→ SoCAMM（近）→ 未來 HBM 貼 CPU（最近）。</div>"}, {"cat": "概念", "q": "800G → 1.6T 是什麼？代表什麼意義？", "a": "單一網路埠傳輸速度的代際升級。100G→400G→800G→1.6T→3.2T。<strong>影響：</strong><div class=\"point\">光通訊需求翻倍（AAOI 擴產 650k+/月）</div><div class=\"point\">CPO 從可選變必要（銅線 1.6T 以上無法忍受）</div><div class=\"point\">TFLN 機會（矽光子調變器 1.6T 以上吃力，TFLN 有結構性優勢）</div><div class=\"point\">DSP 重要性指數級提升（Marvell 核心受益）</div>"}, {"cat": "概念", "q": "800V DC 電力架構造成什麼改變？", "a": "從 48V 升到 800V。電壓高 16 倍、電流小 16 倍。轉換從 5 階段→2 階段，銅用量減 45%，損耗減半。<strong>架構改變：</strong>供電從機櫃級→列級→設施級。MOSFET→SiC/GaN。onsemi 含量增 7.7 倍。<strong>受益者：</strong>onsemi、台達電、Vertiv。<strong>⚠️ SemiAnalysis 說原生 800V 推遲至 2028，400V 先行。大摩和 NVIDIA 否認。</strong>"}, {"cat": "爭議", "q": "SemiAnalysis vs 產業方：CPO 和 800V 到底延不延遲？", "a": "<strong>SemiAnalysis：</strong>800V 推遲至 2028（hyperscaler 抵制）。CPO Scale-out 系統良率僅 19%，2027 預期過激進，推到 2029。<strong>反駁方：</strong>NVIDIA SVP 說 H2 2026 CPO 按計劃量產。Lumentum 說 Scale-up 2027H2 出貨。大摩說與 Computex 調查相悖。<div class=\"point\"><strong>判斷：</strong>兩邊可能在講不同層級 CPO。NPO 2026-27 先行→Scale-up 2027-28→Scale-out 2028-29。對廣泛 AI 供應鏈影響小，對純 CPO 概念股時程風險大。</div>"}, {"cat": "記憶體", "q": "NAND 需求會因 AI 上升嗎？SNDK 的故事？2D vs 3D？", "a": "<strong>暴增。</strong>Vera Rubin 單台 1,152TB SSD。今年 3 萬台吃全球 2.8%，明年 10 萬台吃 9.3%。<strong>SNDK：</strong>從 WDC 分拆，NAND 晶圓+品牌一體。漲價直接反映財報。企業級 SSD 佔比提升。不擴產供給紀律好。「NAND 版南亞科」。<div class=\"point\"><strong>2D vs 3D：</strong>2D（旺宏華邦）= 平房，小容量嵌入式（車用 ECU/IoT），大廠退出後獨佔。3D（SNDK/Micron）= 高樓，大容量 SSD（AI 伺服器），需求暴增推動。兩邊客戶不同、漲價原因不同，都受益於供需失衡。</div>"}, {"cat": "設備", "q": "東京電子的業務內容？", "a": "TEL（8035.JP）全球第三大半導體設備公司。<strong>核心：</strong>塗佈/顯影機、蝕刻機、成膜設備（SK Hynix 375 層鉬沉積選 TEL 爐管）、清洗設備。<div class=\"point\"><strong>為什麼重要：</strong>WFE 最大上修是記憶體不是 GPU。全線滿產雙班制推漲價。後段（DISCO/EVG）也吃緊。SK Hynix 選 TEL 不選 Lam 是大單。</div>"}, {"cat": "投資", "q": "這次週報的機會點？對應股票？", "a": "<strong>最高確定性：</strong>記憶體（MU/SNDK/SK Hynix）、設備（TEL/DISCO）、MLCC（Murata 📌）。<strong>高確信但有爭議：</strong>CPO（SIVE/LITE/MRVL）、Nokia、800V（台達電/Vertiv/onsemi）。<strong>新瓶頸：</strong>後成（WF6）、Mitsui/Co-Tech（銅箔）、Air Liquide/Entegris（鉬）。<strong>Art of Speculation 只選 5 個：</strong>DRAM ETF、FOTO ETF、NVDA、MRVL、NOK。"}];
const INSIGHTS=[{"title": "瓶頸逐層剝洋蔥", "desc": "GPU→記憶體→基板→供電→光互連→設備→原材料和化學品"}, {"title": "Supply Chain Inheritance", "desc": "AI capex 繼承 EV 供應鏈，供應商寧可漲價不擴產"}, {"title": "Jensen 官方認證", "desc": "GTC Taipei：從晶圓到矽光子到線纜，一切都短缺"}, {"title": "EMIB-T 重塑格局", "desc": "Google TPU + SpaceX/xAI 採用，帶動矽電容和 Ibiden"}, {"title": "記憶體缺到 2028", "desc": "新產能 2027 底，長約鎖量悖論，DRAM 營收年增 303%"}, {"title": "CPO 時程分歧", "desc": "SemiAnalysis 說 Scale-out 2029，NVIDIA SVP 說 H2 2026 量產"}, {"title": "瓶頸穿透到原材料", "desc": "鉬、WF6、HVLP4 銅箔、T-Glass，NVIDIA 直接介入上游"}, {"title": "分析師共識形成", "desc": "存儲→光互連→算力→電力，四個獨立來源指向同一優先序"}];
let aC="optical",sT=null,cM="map",aFC="全部";
const allC=[];let totalCo=0,totalLy=0;
Object.entries(CHAINS).forEach(([k,c])=>{totalLy+=c.layers.length;c.layers.forEach(l=>{totalCo+=l.companies.length;l.companies.forEach(co=>allC.push({...co,ck:k,chain:c.label,layer:l.name,color:c.color}))})});
const fCats=["全部",...[...new Set(FAQS.map(f=>f.cat))]];
document.getElementById("stats").innerHTML=`<div class="stat-i"><div class="stat-n">${Object.keys(CHAINS).length}</div><div class="stat-l">供應鏈</div></div><div class="stat-i"><div class="stat-n">${totalLy}</div><div class="stat-l">層級</div></div><div class="stat-i"><div class="stat-n">${totalCo}</div><div class="stat-l">公司</div></div><div class="stat-i"><div class="stat-n">${FAQS.length}</div><div class="stat-l">FAQ</div></div>`;
function switchMode(m){cM=m;document.querySelectorAll('.mode-tab').forEach((t,i)=>t.className='mode-tab'+(i===(m==='map'?0:1)?' active':''));document.getElementById('mapS').className='map-s'+(m==='map'?' show':'');document.getElementById('faqS').className='faq-s'+(m==='faq'?' show':'');if(m==='faq')rF()}
function rM(){const tabs=document.getElementById("tabs");tabs.innerHTML="";Object.entries(CHAINS).forEach(([k,c])=>{const b=document.createElement("button");b.className="tab"+(aC===k?" active":"");b.textContent=c.icon+" "+c.label;b.style.background=aC===k?c.color:"#1f1f23";b.onclick=()=>{aC=k;sT=null;rM()};tabs.appendChild(b)});const ch=CHAINS[aC];document.documentElement.style.setProperty("--cc",ch.color);document.documentElement.style.setProperty("--cc-dim",ch.color+"22");const cc=document.getElementById("cC");let h=`<div class="cb"><div class="ch"><span class="ic">${ch.icon}</span><div><h2>${ch.label}</h2><p class="inf">${ch.layers.length} 層 ｜ ${ch.layers.reduce((a,l)=>a+l.companies.length,0)} 家公司</p></div></div>`;ch.layers.forEach(ly=>{h+=`<div class="ly"><div class="ln"><div class="lb" style="background:${ch.color}"></div><span>${ly.name}</span></div><div class="cos">`;ly.companies.forEach(co=>{const s=sT===co.ticker;const cls="co"+(s?" sel":"")+(co.hl?" hl":"");const bg=s?ch.color+"22":co.hl?"#eab30811":"#18181b";const bc=s?ch.color:co.hl?"#eab308":"#27272a";const cl=s?"#fafafa":co.hl?"#eab308":"#d4d4d8";h+=`<button class="${cls}" style="background:${bg};border-color:${bc};color:${cl}" onclick="sC('${co.ticker.replace(/'/g,"\\'")}')">${co.flag} ${co.ticker}</button>`});h+=`</div></div>`});h+=`</div>`;cc.innerHTML=h;const d=document.getElementById("det");if(sT){const co=allC.find(c=>c.ticker===sT);if(co){document.getElementById("dT").textContent=co.flag+" "+co.ticker;document.getElementById("dP").textContent=co.chain+" › "+co.layer;document.getElementById("dN").textContent=co.note;d.className="det show"}}else d.className="det"}
function sC(t){sT=sT===t?null:t;const co=allC.find(c=>c.ticker===t);if(co&&co.ck!==aC)aC=co.ck;rM()}
function cD(){sT=null;rM()}
function rF(){const ce=document.getElementById("fC");ce.innerHTML="";fCats.forEach(c=>{const b=document.createElement("button");b.className="fcat"+(aFC===c?" active":"");b.textContent=c;b.onclick=()=>{aFC=c;rF()};ce.appendChild(b)});fF()}
function fF(){const q=(document.getElementById("faqSr").value||"").toLowerCase();let f=FAQS;if(aFC!=="全部")f=f.filter(x=>x.cat===aFC);if(q.length>1)f=f.filter(x=>x.q.toLowerCase().includes(q)||x.a.toLowerCase().includes(q));document.getElementById("fCnt").textContent=`顯示 ${f.length} / ${FAQS.length} 則`;document.getElementById("fL").innerHTML=f.map((x,i)=>`<div class="fqi" id="f${i}"><div class="fq" onclick="tF(${i})"><span class="fqt">${x.q}</span><span class="fqc">${x.cat}</span><span class="far">▼</span></div><div class="fa">${x.a}</div></div>`).join("")}
function tF(i){document.getElementById("f"+i).classList.toggle("open")}
document.getElementById("search").addEventListener("input",function(e){const q=e.target.value.toLowerCase();const b=document.getElementById("sR");if(q.length<2){b.className="sr";return}const r=allC.filter(c=>c.ticker.toLowerCase().includes(q)||c.note.toLowerCase().includes(q));if(!r.length){b.className="sr";return}b.className="sr show";b.innerHTML=r.slice(0,10).map(c=>`<div class="sr-i" onclick="document.getElementById('search').value='';document.getElementById('sR').className='sr';sC('${c.ticker.replace(/'/g,"\\'")}')"><b>${c.flag} ${c.ticker}</b><span class="m">${c.chain} › ${c.layer}</span></div>`).join("")});
document.getElementById("iG").innerHTML=INSIGHTS.map(i=>`<div class="ic2"><p class="t">${i.title}</p><p class="d">${i.desc}</p></div>`).join("");
rM();
</script>
